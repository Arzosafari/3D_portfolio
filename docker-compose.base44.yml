# Base44 sandbox runbook — development only.
# Runs the cloned source with the project's own Vite dev server (live reload),
# so edits in the repo appear immediately in the preview without a rebuild.
#   Start: docker compose -f docker-compose.base44.yml up -d --build
# The app is a frontend-only Vite/React SPA: no database or external service is
# required (the AI provider defaults to the offline mock). Nothing else in the
# repo's own docker-compose files is reused — this one is authoritative here.
services:
  web:
    # Plain runtime base image: the app code comes from the bind mount below,
    # never from a prebuilt image.
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      # Vite dev server bind address (the project's `dev` script already passes
      # --host 0.0.0.0; kept explicit for clarity).
      - HOST=0.0.0.0
      # Bare pass-through of the platform flag; no app behavior depends on it here.
      - BASE44_PREVIEW_MODE
    # Dependencies live in the bind mount (node_modules is gitignored). Sync from
    # the lockfile when they are missing or the lockfile changed, then hand the
    # process over to the dev server so signals reach it.
    command:
      - sh
      - -ec
      - |
        if [ ! -d node_modules ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then
          npm ci --no-audit --no-fund
        fi
        exec npm run dev
    healthcheck:
      # Probes the dev server's actual HTTP response, using node itself (always
      # present in this image) so no extra tooling is needed.
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure
